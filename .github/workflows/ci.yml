# Offline tests on Linux and Windows, and audits of the locked dependencies.
# macOS is left out until it is needed (docs/roadmap.md, "Deferred"). The docker job builds and smoke-tests the image.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tags: pinned to the commit of v10.3.2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"

      - name: Python dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      # test_viewer.py needs node_modules (esbuild) and checks that viewer/dist is built from viewer/src
      - name: Viewer dependencies and type check
        working-directory: viewer
        run: |
          npm ci
          npm run check

      # Headless Edge tests run where Edge is installed (windows-latest) and are skipped elsewhere
      - name: Tests
        run: uv run --frozen pytest -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"

      # The locked runtime dependencies with hashes: pip-audit checks exactly these pins, without pip resolving anything
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o requirements-audit.txt
          uv tool run pip-audit --strict --disable-pip --require-hashes --progress-spinner off -r requirements-audit.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Only what goes into the bundle (the dev tools never reach users)
      - name: npm audit
        working-directory: viewer
        run: npm audit --omit=dev

  # The image of the public site: build it, run a search and the two services in it as compose
  # runs them (read-only root, no capabilities), and check the compose files with example settings
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Example settings and secrets
        run: |
          cp findaline.env.example findaline.env
          printf 'WORKER_CPUS=2\nWORKER_MEMORY=4g\n' > .env
          cp compose.override.example.yaml compose.override.yaml
          for name in findaline_session_secret findaline_github_client_secret findaline_google_client_secret; do
            python3 -c "import secrets; print(secrets.token_urlsafe(48))" > "secrets/$name"
          done
          : > secrets/opentopography_api_key  # empty: no NASADEM
          docker network create --internal --subnet 172.30.0.0/24 --ip-range 172.30.0.128/25 \
            --opt com.docker.network.bridge.name=br-fal-proxy findaline-proxy

      - name: Compose files
        run: docker compose config --quiet

      - name: Build the image
        run: docker compose build

      - name: Command line in the image
        run: docker compose run --rm --no-deps worker --help

      # The Żabi Koń clip offline: numba's cache, the run and the viewer copy must all land in /data
      - name: A search in the image
        run: |
          docker compose run --rm --no-deps --volume "$PWD/tests/data:/clip:ro" worker \
            --elevation-file /clip/zabi_kon_nmt.tif --surface-file /clip/zabi_kon_nmpt.tif \
            --northing 254608 --easting 553966 --radius 290 --water off --fill-gaps off --no-plot --yes

      # --wait: until the web service's healthcheck passes
      - name: Services
        run: |
          docker compose up --detach --wait --wait-timeout 120
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: findaline.example.org' http://127.0.0.1:8765/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)" = 400  # any other host
          docker compose stop worker
          docker compose ps --all
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet worker)")" = 0

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: |
          docker compose down --volumes
          docker network rm findaline-proxy || true
