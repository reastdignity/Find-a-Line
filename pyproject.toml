[project]
name = "find-a-line"
version = "0.1.0"
description = "Finds possible highlines in elevation data"
readme = "README.md"
requires-python = ">=3.12"  # scipy 1.18 needs it
dependencies = [
    "affine>=2.4",
    "contextily>=1.6",
    "fastapi>=0.162.0",
    "geopandas>=1.1",
    "matplotlib>=3.10",
    "numba>=0.68",
    "numpy>=2.3",
    "osmium>=4.3",
    "psutil>=7",
    "pydantic>=2.11",
    "pyproj>=3.7",
    "python-multipart>=0.0.32",
    "rasterio>=1.4",
    "requests>=2.32",
    "scipy>=1.18",
    "shapely>=2.1",
    "tqdm>=4.67",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[tool.uv]
package = false  # a set of scripts, not an installable package

[tool.pytest.ini_options]
testpaths = ["tests"]
