[project]
name = "find-a-line"
version = "0.1.0"
description = "Finds possible highlines in elevation data"
readme = "README.md"
requires-python = ">=3.12"  # scipy 1.18 needs it
dependencies = [
    "affine>=2.4",
    "branca>=0.8",
    "contextily>=1.6",
    "folium>=0.20",
    "geopandas>=1.1",
    "matplotlib>=3.10",
    "numba>=0.68",
    "numpy>=2.3",
    "psutil>=7",
    "pydantic>=2.11",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "requests>=2.32",
    "scipy>=1.18",
    "shapely>=2.1",
    "tqdm>=4.67",
    "xyzservices>=2025.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false  # a set of scripts, not an installable package

[tool.pytest.ini_options]
testpaths = ["tests"]
