# The public site: `web` (the page and the API) and `worker` (the searches) from one image,
# sharing the data volume; they talk only through jobs.sqlite in it.
#
# Before `docker compose up -d --build`:
# - findaline.env: the settings of the site (copy findaline.env.example);
# - secrets/: one file per secret (secrets/README.md), readable by uid 10001;
# - optionally .env next to this file (copy .env.example): resources and the Slovak mirror.
# - the network findaline-proxy, shared with the reverse proxy (SWAG) only:
#     docker network create --internal --subnet 172.30.0.0/24 --ip-range 172.30.0.128/25 \
#       --opt com.docker.network.bridge.name=br-fal-proxy findaline-proxy
#   with SWAG joined to it at the fixed address FINDALINE_TRUSTED_PROXY, 172.30.0.2, outside the
#   range the containers get their addresses from (docs/deployment.md).
#
# Networks (docs/deployment.md, "Networks"): SWAG reaches the web service in findaline-proxy,
# which is internal (no way out). The web service also needs the internet (the OAuth providers'
# token endpoints, Google's metadata and keys), through its own network `web`; the worker gets
# out through `worker` and shares no network with the web service or SWAG. The bridges have
# fixed names (br-fal-*), so the host's firewall can keep all three away from the LAN. The web
# service publishes no port; for a local test copy compose.override.example.yaml to
# compose.override.yaml.

name: findaline

x-image: &image
  image: findaline:local
  build: .
  init: true                 # tini as PID 1: forwards SIGTERM, reaps the phases' processes
  user: "10001:10001"
  read_only: true            # writes go to /data (the volume) and /tmp only
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  env_file: [findaline.env]
  # Public resolvers: the host's may be the router on the LAN, which the firewall rules of
  # docs/deployment.md keep the containers away from (Docker's embedded DNS forwards from the
  # container's network); CONTAINER_DNS_1/_2 in .env change them
  dns: ["${CONTAINER_DNS_1:-9.9.9.9}", "${CONTAINER_DNS_2:-1.1.1.1}"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  web:
    <<: *image
    command: ["web", "--public", "--host", "0.0.0.0", "--port", "8765", "--no-browser"]
    mem_limit: ${WEB_MEMORY:-1g}
    cpus: ${WEB_CPUS:-1}
    pids_limit: 256
    volumes:
      - data:/data
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 67108864}   # 64 MB (mode 1777, the default)
    secrets:
      - findaline_session_secret
      - findaline_github_client_secret
      - findaline_google_client_secret
    networks:
      web:
      proxy:
        aliases: [findaline-web]   # the name SWAG's findaline.subdomain.conf proxies to
    # GET / with the public host as Host (TrustedHostMiddleware answers 400 to any other);
    # the host comes from the same settings as the server's (settings.PublicSettings)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r, settings; r.urlopen(r.Request('http://127.0.0.1:8765/', headers={'Host': settings.PublicSettings.load().host}), timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s   # uvicorn closes the event streams after 5 s

  worker:
    <<: *image
    command: ["worker", "--public"]
    # Most of the machine: set WORKER_CPUS to the number of cores minus one (it may not exceed
    # them) and WORKER_MEMORY to what the host can spare; the search sizes its tiles and threads
    # from these limits (search.cgroup_limits)
    mem_limit: ${WORKER_MEMORY:-8g}
    cpus: ${WORKER_CPUS:-3}
    pids_limit: 4096           # threads count: numba's per process, download pools
    environment:
      FINDALINE_MIRROR: /mirror
    # --source nasadem (admins only on the public site): the key as a Docker secret, the
    # worker's only (settings.ServiceKeys); an empty file means no key
    secrets:
      - opentopography_api_key
    volumes:
      - data:/data
      # The local mirror of the Slovak tiles (the folder above slovakia/), read-only; without
      # FINDALINE_MIRROR_DIR an empty volume, and --source auto takes `europe` for Slovakia
      - ${FINDALINE_MIRROR_DIR:-no-mirror}:/mirror:ro
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 536870912}  # 512 MB
    networks: [worker]
    # SIGTERM: the worker kills its phases' processes (up to 30 s each), marks their jobs
    # interrupted and gives up its lease (jobs.Scheduler.stop)
    stop_grace_period: 90s

volumes:
  data:        # SQLite in WAL mode: a local volume, the same uid in both services
  no-mirror:

# The worker never shares a network with the web service or the proxy; no IPv6 in any of them
networks:
  proxy:
    name: findaline-proxy
    external: true   # created once by hand (above), joined by SWAG too
  web:
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-fal-web
  worker:
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-fal-worker

secrets:
  findaline_session_secret:
    file: ./secrets/findaline_session_secret
  findaline_github_client_secret:
    file: ./secrets/findaline_github_client_secret
  findaline_google_client_secret:
    file: ./secrets/findaline_google_client_secret
  opentopography_api_key:
    file: ./secrets/opentopography_api_key
