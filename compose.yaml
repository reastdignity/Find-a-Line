# The public site: `web` (the page and the API) and `worker` (the searches) from one image,
# sharing the data volume; they talk only through jobs.sqlite in it. What only one of them may
# write is not in the shared volume (docs/deployment.md, "What each service can write"): the
# accounts and sessions are in the web service's own volume, and each service compiles numba's
# code into its own /tmp, so neither loads code or sessions the other could have planted.
#
# Before `docker compose up -d --build`:
# - findaline.env: the settings of the site (copy findaline.env.example);
# - secrets/: one file per secret (secrets/README.md), readable by uid 10001;
# - optionally .env next to this file (copy .env.example): resources and the Slovak mirror.
#
# Networks (docs/deployment.md, sections 2 and 4): nginx on the host reaches the web service on
# 127.0.0.1:8765, the only published port (WEB_PORT in .env changes the host's side); the app sees
# those connections come from the gateway of the network `web`, 172.30.0.1, the
# FINDALINE_TRUSTED_PROXY of findaline.env. The same network takes the web service to the internet
# (the OAuth providers' token endpoints, Google's metadata and keys); the worker gets out through
# `worker` and shares no network with the web service. The bridges have fixed names (br-fal-*), so
# the host's firewall can keep both away from private addresses.

name: findaline

x-image: &image
  image: findaline:local
  build: .
  init: true                 # tini as PID 1: forwards SIGTERM, reaps the phases' processes
  user: "10001:10001"
  read_only: true            # writes go to the volumes and /tmp only
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  env_file: [findaline.env]
  # Public resolvers: the host's may be the router on the LAN, which the firewall rules of
  # docs/deployment.md keep the containers away from (Docker's embedded DNS forwards from the
  # container's network); CONTAINER_DNS_1/_2 in .env change them
  dns: ["${CONTAINER_DNS_1:-9.9.9.9}", "${CONTAINER_DNS_2:-1.1.1.1}"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  web:
    <<: *image
    command: ["web", "--public", "--host", "0.0.0.0", "--port", "8765", "--no-browser"]
    mem_limit: ${WEB_MEMORY:-1g}
    memswap_limit: ${WEB_MEMORY:-1g}   # the same: no swap on top of the limit
    cpus: ${WEB_CPUS:-1}
    pids_limit: 256
    environment:
      FINDALINE_ACCOUNTS_DIR: /accounts
      # The home, numba's compiled code and matplotlib's settings of this service only, gone at
      # every restart (the image's defaults are in the shared /data)
      HOME: /tmp/home
      NUMBA_CACHE_DIR: /tmp/numba
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - data:/data
      - accounts:/accounts         # accounts.sqlite: users and sessions, the web service's only
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 67108864}   # 64 MB (mode 1777, the default)
    secrets:
      - findaline_session_secret
      - findaline_github_client_secret
      - findaline_google_client_secret
    # The loopback only: nginx on the host proxies to it (deploy/nginx/findaline-http.conf)
    ports: ["127.0.0.1:${WEB_PORT:-8765}:8765"]
    networks: [web]
    # GET / with the public host as Host (TrustedHostMiddleware answers 400 to any other);
    # the host comes from the same settings as the server's (settings.PublicSettings)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r, settings; r.urlopen(r.Request('http://127.0.0.1:8765/', headers={'Host': settings.PublicSettings.load().host}), timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s   # uvicorn closes the event streams after 5 s

  worker:
    <<: *image
    command: ["worker", "--public"]
    # Most of the machine: set WORKER_CPUS to the number of cores minus one (a whole number, it
    # may not exceed them) and WORKER_MEMORY to what the host can spare; the search sizes its
    # tiles and threads from these limits (search.cgroup_limits)
    mem_limit: ${WORKER_MEMORY:-8g}
    memswap_limit: ${WORKER_MEMORY:-8g}   # the same: no swap on top of the limit
    cpus: ${WORKER_CPUS:-3}
    pids_limit: 4096           # threads count: numba's per process, download pools
    environment:
      FINDALINE_MIRROR: /mirror
      # numba's threads: the cores of the quota, not all the host's cores the container sees
      # (each computing job's, also with several compute slots)
      NUMBA_NUM_THREADS: ${WORKER_CPUS:-3}
      # Jobs computed and downloaded at once (settings.Limits); with several compute slots each
      # search gets an equal share of WORKER_MEMORY, less the quick lane's and the downloads'
      # (search.slot_memory); docs/deployment.md, "Cores and memory", for the values
      FINDALINE_LIMIT_COMPUTE_SLOTS: ${WORKER_COMPUTE_SLOTS:-1}
      FINDALINE_LIMIT_DOWNLOAD_SLOTS: ${WORKER_DOWNLOAD_SLOTS:-1}
      # numba's compiled code (loaded by every phase's process), the home and matplotlib's
      # settings in the worker's own /tmp: compiled once per start of the container (a few
      # seconds), never from files the web service could have written
      HOME: /tmp/home
      NUMBA_CACHE_DIR: /tmp/numba
      MPLCONFIGDIR: /tmp/matplotlib
    # --source nasadem (admins only on the public site): the key as a Docker secret, the
    # worker's only (settings.ServiceKeys); an empty file means no key
    secrets:
      - opentopography_api_key
    volumes:
      - data:/data
      # The local mirror of the Slovak tiles (the folder above slovakia/), read-only; without
      # FINDALINE_MIRROR_DIR an empty volume, and --source auto takes `europe` for Slovakia
      - ${FINDALINE_MIRROR_DIR:-no-mirror}:/mirror:ro
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 536870912}  # 512 MB
    networks: [worker]
    # SIGTERM: the worker kills its phases' processes (up to 30 s each), marks their jobs
    # interrupted and gives up its lease (jobs.Scheduler.stop)
    stop_grace_period: 90s

volumes:
  data:        # SQLite in WAL mode: a local volume, the same uid in both services
  accounts:    # accounts.sqlite (WAL), the web service's only
  no-mirror:

# The worker never shares a network with the web service; no IPv6 in either
networks:
  web:
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-fal-web
    # A fixed gateway: the address the published port's connections come from, which the app
    # trusts for X-Forwarded-For (FINDALINE_TRUSTED_PROXY)
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  worker:
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-fal-worker

secrets:
  findaline_session_secret:
    file: ./secrets/findaline_session_secret
  findaline_github_client_secret:
    file: ./secrets/findaline_github_client_secret
  findaline_google_client_secret:
    file: ./secrets/findaline_google_client_secret
  opentopography_api_key:
    file: ./secrets/opentopography_api_key
