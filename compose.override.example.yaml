# A local test of the public site without a reverse proxy: copy to compose.override.yaml
# (git-ignored; `docker compose` reads it after compose.yaml) and set in findaline.env
#   FINDALINE_PUBLIC_URL=http://127.0.0.1:8765
#   FINDALINE_TRUSTED_PROXY=127.0.0.1
# The page is then at http://127.0.0.1:8765/, reachable from this computer only.
services:
  web:
    ports:
      - "127.0.0.1:8765:8765"
