## Find-a-Line: the http-context part of its SWAG configuration (docs/deployment.md)
# Copy to /config/nginx/site-confs/00-findaline-http.conf. SWAG's nginx.conf includes
# site-confs/*.conf inside its http block, in alphabetical order, and default.conf there
# includes proxy-confs/*.subdomain.conf: the name 00-... puts this file first, because the
# log format must be defined before findaline.subdomain.conf names it.

# Requests per client address: everything (the page, the maps, run files, orthophoto tiles from
# /cache/: a map view asks for dozens at once), and signing in (/login/, /auth/)
limit_req_zone $binary_remote_addr zone=findaline:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=findaline_login:1m rate=10r/m;
# Connections, or HTTP/2 streams, of one address at once (an open page holds one for its events)
limit_conn_zone $binary_remote_addr zone=findaline_conn:10m;

# The access log without secrets: the token of a share link (/s/<token>/...) and the query of a
# sign-in callback (/auth/<provider>?code=...&state=...) are replaced, in the request line and in
# the Referer (a shared map's own requests carry its address there)
map $request $findaline_request {
    "~^(?<fal_s>\S+ /s/)(?!_viewer/|runs\.js[?\s]|index\.html[?\s])[^/?\s]+(?<fal_t>.*)$" "${fal_s}<token>${fal_t}";
    "~^(?<fal_a>\S+ /auth/[^?\s]*)\?\S*(?<fal_b> .*)$" "${fal_a}?<query>${fal_b}";
    default $request;
}
map $http_referer $findaline_referer {
    "~^(?<fal_r>https?://[^/]+/s/)(?!_viewer/|runs\.js|index\.html)[^/?#]+(?<fal_u>.*)$" "${fal_r}<token>${fal_u}";
    "" "-";
    default $http_referer;
}

# nginx's "combined" format with the two masked fields (fail2ban's filters read it as usual)
log_format findaline '$remote_addr - $remote_user [$time_local] "$findaline_request" $status '
                     '$body_bytes_sent "$findaline_referer" "$http_user_agent"';
