## Version 2026/10/28 - Find-a-Line, docs/deployment.md
# Copy to /config/nginx/proxy-confs/findaline.subdomain.conf.
# make sure that 00-findaline-http.conf is in /config/nginx/site-confs/ (rate limit zones, the masked log format)
# make sure that SWAG and the web service of Find-a-Line share the network findaline-proxy, where
# the web service has the alias findaline-web (compose.yaml)
# make sure that your dns has a cname set for findaline (or change server_name to your subdomain)
# The app sets its own security headers (CSP, X-Frame-Options, Referrer-Policy, ...); every location
# below has an add_header, so the optional headers of ssl.conf are not inherited and never doubled.

server {
    listen 443 ssl;
#    listen 443 quic;
    listen [::]:443 ssl;
#    listen [::]:443 quic;

    server_name findaline.*;

    include /config/nginx/ssl.conf;

    # Requests of the app are small JSON (a drawn area at most); uploads are read in the browser
    client_max_body_size 2m;
    # Slow clients (slowloris): 10 s, not nginx's 60 s, for a request's headers and body. They
    # apply to this site only: over HTTP/2 to both, over HTTP/1.1 to the body; the headers of an
    # HTTP/1.1 request are read under the default server's timeout (docs/deployment.md, section 4)
    client_header_timeout 10s;
    client_body_timeout 10s;

    # The app has no WebSockets: a request to switch protocols (proxy.conf would pass it on) is
    # refused here, before the rate limits and before the app
    if ($http_upgrade) {
        return 400;
    }

    # Here rather than in each location, so a location may change a single value of proxy.conf
    # (proxy_read_timeout for the event stream) without repeating it
    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;

    # Its own log, in the masked format; the jail findaline reads it. The error log's lines name
    # the request and its Referer unmasked, so it keeps only errors (level error: an upstream that
    # is down or fails), not warnings (a large answer buffered to a temporary file) or the
    # refusals of the limits (info); the locations whose addresses hold secrets keep only crit.
    access_log /config/log/nginx/findaline.access.log findaline;
    error_log /config/log/nginx/findaline.error.log error;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level info;
    limit_conn_log_level info;
    limit_conn findaline_conn 40;

    # A run's data.js and lines.js shrink severalfold: what matters on a home uplink. text/html is
    # always compressed when gzip is on.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/javascript application/javascript application/json text/css text/csv text/plain
               application/geo+json image/svg+xml;

    location / {
        limit_req zone=findaline burst=200 nodelay;
        add_header Strict-Transport-Security "max-age=63072000" always;

        set $upstream_app findaline-web;
        set $upstream_port 8765;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    }

    # Share links (/s/<token>/...), and the orthophoto tiles a shared map asks for (their Referer
    # is the map's address, with the token): as / but without errors in the error log
    location ^~ /s/ {
        limit_req zone=findaline burst=200 nodelay;
        add_header Strict-Transport-Security "max-age=63072000" always;
        error_log /config/log/nginx/findaline.error.log crit;

        set $upstream_app findaline-web;
        set $upstream_port 8765;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    }

    location ^~ /cache/ {
        limit_req zone=findaline burst=200 nodelay;
        add_header Strict-Transport-Security "max-age=63072000" always;
        error_log /config/log/nginx/findaline.error.log crit;

        set $upstream_app findaline-web;
        set $upstream_port 8765;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    }

    # Signing in: a stricter limit per address (two requests per sign-in); the callback's query
    # (code, state) is kept out of the error log
    location ~ ^/(login|auth)/ {
        limit_req zone=findaline_login burst=10 nodelay;
        add_header Strict-Transport-Security "max-age=63072000" always;
        error_log /config/log/nginx/findaline.error.log crit;

        set $upstream_app findaline-web;
        set $upstream_port 8765;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    }

    # The event stream (SSE): each message at once, a connection open for long (the app sends a
    # keep-alive comment every 15 s)
    location = /api/events {
        limit_req zone=findaline burst=200 nodelay;
        add_header Strict-Transport-Security "max-age=63072000" always;

        set $upstream_app findaline-web;
        set $upstream_port 8765;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
