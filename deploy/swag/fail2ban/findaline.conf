# Find-a-Line: requests the app or SWAG refused (401 sign-in required, 403 forbidden, 429 too
# many requests) in /config/log/nginx/findaline.access.log (the format findaline of
# 00-findaline-http.conf: nginx's combined). Copy to /config/fail2ban/filter.d/findaline.conf;
# the jail is in jail.findaline.local.

[Definition]

failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Z]+ [^"]*" (?:401|403|429) \d+ 

ignoreregex =

datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z
