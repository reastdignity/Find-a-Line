## Find-a-Line: port 80 (docs/deployment.md, section 4)
# Copy to /etc/nginx/sites-available/findaline-acme with the site's name in place of
# findaline.example.org, and link it into sites-enabled/. It works before the certificate exists:
# certbot proves the domain through /.well-known/acme-challenge/ (certonly --webroot), and every
# other request is sent to https, www.findaline.example.org's to the site's name.

# Anything that does not name the site (scanners asking for the address of the server): the
# connection is closed without an answer
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log findaline;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name findaline.example.org www.findaline.example.org;
    server_tokens off;

    # A share link opened as http:// would otherwise leave its token in the log
    access_log /var/log/nginx/findaline.access.log findaline;
    error_log /var/log/nginx/findaline.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://findaline.example.org$request_uri;
    }
}
