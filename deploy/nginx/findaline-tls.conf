## Find-a-Line: TLS settings of both servers on port 443 (docs/deployment.md, section 4)
# Copy to /etc/nginx/snippets/findaline-tls.conf; findaline.conf includes it. Mozilla's
# "intermediate" configuration (ssl-config.mozilla.org, nginx 1.28, OpenSSL 3): TLS 1.2 and 1.3,
# forward-secret AEAD ciphers only. No OCSP stapling: Let's Encrypt no longer runs an OCSP service.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:findaline_tls:10m;
ssl_session_tickets off;
