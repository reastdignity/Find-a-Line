## Find-a-Line: the site on port 443 (docs/deployment.md, section 4)
# Copy to /etc/nginx/sites-available/findaline with the site's name in place of
# findaline.example.org, and link it into sites-enabled/ once the certificate exists (certbot,
# section 4). Needs conf.d/findaline-http.conf (zones, the masked log format, the upstream) and
# snippets/findaline-tls.conf. The app sets its own security headers (CSP, X-Frame-Options,
# Referrer-Policy, ...); nginx adds HSTS only.

# Anything that does not name the site: the TLS handshake is refused, so no certificate (and no
# name of the site) is shown to scanners of the address
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    include /etc/nginx/snippets/findaline-tls.conf;
    ssl_reject_handshake on;
    access_log /var/log/nginx/access.log findaline;
}

# www.findaline.example.org: sent to the site's name. Its certificate holds the www name once its
# A record points here (section 3; deploy/vps.sh issues it again then); without the record nobody
# arrives here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.findaline.example.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/findaline.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/findaline.example.org/privkey.pem;
    include /etc/nginx/snippets/findaline-tls.conf;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # A share link opened with www would otherwise leave its token in the log
    access_log /var/log/nginx/findaline.access.log findaline;
    error_log /var/log/nginx/findaline.error.log crit;

    return 301 https://findaline.example.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name findaline.example.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/findaline.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/findaline.example.org/privkey.pem;
    include /etc/nginx/snippets/findaline-tls.conf;

    # Here, at the server level, for every location: a location with an add_header of its own
    # would not inherit it (add it there again)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Requests of the app are small JSON (a drawn area at most); uploads are read in the browser
    client_max_body_size 2m;

    # The app has no WebSockets: a request to switch protocols is refused here, before the rate
    # limits and before the app
    if ($http_upgrade) {
        return 400;
    }

    # To the app: the client's address replaces any X-Forwarded-For it sent (the app believes the
    # header from FINDALINE_TRUSTED_PROXY only, the gateway of the network `web`), HTTP/1.1 with
    # kept-alive connections. An estimate or a profile may wait for the quick lane up to
    # web.QUICK_WAIT_MAX (600 s) before it is answered.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 620s;

    # Its own log, in the masked format; the jail findaline reads it. The error log's lines name
    # the request and its Referer unmasked, so it keeps only errors (level error: an upstream that
    # is down or fails), not warnings (a large answer buffered to a temporary file) or the
    # refusals of the limits (info); the locations whose addresses hold secrets keep only crit.
    access_log /var/log/nginx/findaline.access.log findaline;
    error_log /var/log/nginx/findaline.error.log error;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level info;
    limit_conn_log_level info;
    limit_conn findaline_conn 40;

    # A run's data.js and lines.js shrink severalfold. text/html is always compressed when gzip is
    # on (nginx.conf turns it on).
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/javascript application/javascript application/json text/css text/csv text/plain
               application/geo+json image/svg+xml;

    location / {
        limit_req zone=findaline burst=200 nodelay;
        proxy_pass http://findaline;
    }

    # Share links (/s/<token>/...), and the orthophoto tiles a shared map asks for (their Referer
    # is the map's address, with the token): as / but without errors in the error log
    location ^~ /s/ {
        limit_req zone=findaline burst=200 nodelay;
        error_log /var/log/nginx/findaline.error.log crit;
        proxy_pass http://findaline;
    }

    # Orthophoto tiles: a zone of their own with a larger burst, and more requests at once (a
    # browser asks for them over one HTTP/2 connection); fail2ban does not count their 429
    location ^~ /cache/ {
        limit_req zone=findaline_tiles burst=1000 nodelay;
        limit_conn findaline_conn 100;
        error_log /var/log/nginx/findaline.error.log crit;
        proxy_pass http://findaline;
    }

    # Signing in: a stricter limit per address (two requests per sign-in); the callback's query
    # (code, state) is kept out of the error log
    location ~ ^/(login|auth)/ {
        limit_req zone=findaline_login burst=10 nodelay;
        error_log /var/log/nginx/findaline.error.log crit;
        proxy_pass http://findaline;
    }

    # The event stream (SSE): each message at once, a connection open for long (the app sends a
    # keep-alive comment every 15 s)
    location = /api/events {
        limit_req zone=findaline burst=200 nodelay;
        proxy_pass http://findaline;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
