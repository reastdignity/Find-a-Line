## Find-a-Line: the http-context part of its nginx configuration (docs/deployment.md, section 4)
# Copy to /etc/nginx/conf.d/findaline-http.conf. Ubuntu's nginx.conf includes conf.d/*.conf inside
# its http block before sites-enabled/*, so the zones, the log format and the upstream are defined
# before findaline.conf names them. Directives that nginx.conf already sets in the http block
# (server_tokens, ssl_protocols, gzip) are set per server in findaline.conf instead: the same
# directive twice in one block is an error.

# The web service of compose.yaml, published on the loopback only. Idle connections to it are kept
# for less than uvicorn keeps them (web.KEEP_ALIVE_SECONDS, 5 s), so nginx never sends a request on
# one the app is closing.
upstream findaline {
    server 127.0.0.1:8765;
    keepalive 16;
    keepalive_timeout 4s;
}

# Slow clients (slowloris): 10 s, not nginx's 60 s, for a request's headers and body. Set here for
# every server of the host: the headers of an HTTP/1.1 request are read under the timeout of the
# listening socket's default server, before nginx knows which site the request is for.
client_header_timeout 10s;
client_body_timeout 10s;

# Requests per client address: everything (the page, the maps, run files), orthophoto tiles
# (/cache/: zooming a map asks for a few hundred within seconds, 130 in one second seen), and
# signing in (/login/, /auth/)
limit_req_zone $binary_remote_addr zone=findaline:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=findaline_tiles:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=findaline_login:1m rate=10r/m;
# Connections, or HTTP/2 streams, of one address at once (an open page holds one for its events)
limit_conn_zone $binary_remote_addr zone=findaline_conn:10m;

# The access log without secrets: the token of a share link (/s/<token>/...) and the query of a
# sign-in callback (/auth/<provider>?code=...&state=...) are replaced, in the request line and in
# the Referer (a shared map's own requests carry its address there)
map $request $findaline_request {
    "~^(?<fal_s>\S+ /s/)(?!_viewer/|runs\.js[?\s]|index\.html[?\s])[^/?\s]+(?<fal_t>.*)$" "${fal_s}<token>${fal_t}";
    "~^(?<fal_a>\S+ /auth/[^?\s]*)\?\S*(?<fal_b> .*)$" "${fal_a}?<query>${fal_b}";
    default $request;
}
map $http_referer $findaline_referer {
    "~^(?<fal_r>https?://[^/]+/s/)(?!_viewer/|runs\.js|index\.html)[^/?#]+(?<fal_u>.*)$" "${fal_r}<token>${fal_u}";
    "" "-";
    default $http_referer;
}

# nginx's "combined" format with the two masked fields (fail2ban's filters read it as usual)
log_format findaline '$remote_addr - $remote_user [$time_local] "$findaline_request" $status '
                     '$body_bytes_sent "$findaline_referer" "$http_user_agent"';
