# Find-a-Line: requests the app or nginx refused (401 sign-in required, 403 forbidden, 429 too
# many requests) in /var/log/nginx/findaline.access.log (the format findaline of
# deploy/nginx/findaline-http.conf: nginx's combined). Copy to /etc/fail2ban/filter.d/findaline.conf;
# the jail is in findaline.local.

[Definition]

failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Z]+ [^"]*" (?:401|403|429) \d+

ignoreregex =

datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z
